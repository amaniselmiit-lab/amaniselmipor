name: Deploy portfolio to GitHub Pages

# Publie le portfolio d'Amani Selmi sur GitHub Pages.
# Site 100 % statique (HTML/CSS/JS) servi à la racine du dépôt.
# Se déclenche à chaque push sur « main » (ou manuellement).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions requises pour publier sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          # Copie tout le dépôt sauf les dossiers techniques.
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          # Évite tout traitement Jekyll.
          touch _site/.nojekyll

      # enablement: true active GitHub Pages automatiquement au premier run,
      # sans avoir à le faire manuellement dans les réglages du dépôt.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
